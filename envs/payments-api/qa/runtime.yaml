# Runtime configuration for payments-api in qa.
# Self-contained: every environment-specific value for this API lives here,
# so apis/payments-api/config.yaml is promoted unchanged across environments.
app: payments-api
env: qa

publicHostname: qa-flex.fxf.example.com
tlsCertName: fxf-qa-wildcard

proxyUri: http://0.0.0.0:8081

# Backend URI per endpoint. Keys must match the endpoint names in
# apis/payments-api/config.yaml.
endpoints:
  payments-charge: https://l7-gw.fxf.internal/payments/charge
  payments-refund: https://l7-gw.fxf.internal/payments/refund
  payments-status: https://l7-gw.fxf.internal/payments/status
