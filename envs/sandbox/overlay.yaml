# Per-environment overlay for DEV.
# Values here override / extend apis/{app}/config.yaml at deploy time.
# Keeping env-specific values in overlays (not base) guarantees the SAME
# config is promoted across all 5 environments (eliminates per-engineer drift).
env: sandbox
defaults:
  publicHostname: demo-1-mq4lco.5sc6y6-1.usa-e2.cloudhub.io
  tlsCertName: fxf-dev-wildcard
apps:
  payments-api:
    proxyUri: http://0.0.0.0:8081
  orders-api:
    proxyUri: http://0.0.0.0:8082
  customer-api:
    proxyUri: http://0.0.0.0:8083
