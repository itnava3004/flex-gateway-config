# Runtime configuration for orders-api in dev.
# Self-contained: every environment-specific value for this API lives here,
# so apis/orders-api/config.yaml is promoted unchanged across environments.
app: orders-api
env: dev

publicHostname: fxf-dev-gtwy-bdvahp.4qpgqv.usa-e2.cloudhub.io
tlsCertName: fxf-dev-wildcard

proxyUri: http://0.0.0.0:8082

# Backend URI per endpoint. Keys must match the endpoint names in
# apis/orders-api/config.yaml.
endpoints:
  orders-cancel: https://l7-gw.fxf.internal/orders/cancel
  orders-create: https://l7-gw.fxf.internal/orders/create
  orders-list:   https://l7-gw.fxf.internal/orders/list
  orders-track:  https://l7-gw.fxf.internal/orders/track
