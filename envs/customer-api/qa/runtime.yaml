# Runtime configuration for customer-api in qa.
# Self-contained: every environment-specific value for this API lives here,
# so apis/customer-api/config.yaml is promoted unchanged across environments.
app: customer-api
env: qa
# Config-contract version this environment deploys. Set it equal to
# apis/<app>/config.yaml configVersion to publish the working copy; set it to
# an older published version to replay that version from Nexus instead.
deployVersion: 1.0.0
# Gateway this API deploys to in this environment. Required — must match a
# key under anypoint.yaml environments.qa.gateways.
gateway: fxf-qa-gtwy

proxyUri: http://0.0.0.0:8083

# Backend host every route for this API forwards to. Host only — no path.
# Per-endpoint paths live on the route rules (publicPath in config.yaml).
upstreamHost: https://l7-gw.fxf.internal

# Optional per-environment path overrides, keyed on endpoint name. Omit to
# use the publicPath declared in apis/<app>/config.yaml.
# endpoints:
#   customer-address: /customer/address
#   customer-consent: /customer/consent
#   customer-profile: /customer/profile
