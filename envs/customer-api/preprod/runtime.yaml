# Runtime configuration for customer-api in preprod.
# Self-contained: every environment-specific value for this API lives here,
# so apis/customer-api/config.yaml is promoted unchanged across environments.
app: customer-api
env: preprod
# Config-contract version this environment deploys. Set it equal to
# apis/<app>/config.yaml apiVersion to publish the working copy; set it to
# an older published version to replay that version from Nexus instead.
deployVersion: 1.0.0
# Which gateway in this environment this API deploys to. Must match a key
# under anypoint.yaml environments.<env>.gateways. Omit to use defaultGateway.
# gateway: fxf-dev-gtwy-2

publicHostname: preprod-flex.fxf.example.com
tlsCertName: fxf-preprod-wildcard

proxyUri: http://0.0.0.0:8083

# Backend URI per endpoint. Keys must match the endpoint names in
# apis/customer-api/config.yaml.
endpoints:
  customer-address: https://l7-gw.fxf.internal/customer/address
  customer-consent: https://l7-gw.fxf.internal/customer/consent
  customer-profile: https://l7-gw.fxf.internal/customer/profile
