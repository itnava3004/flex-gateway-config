# Policy template: Client ID Enforcement
# Validates client_id / client_secret headers against the Anypoint Client Store.
# This is the standard auth pattern for all FXF Flex Gateway APIs.
#
# Usage in apis/{app}/config.yaml — reference only:
#   policies:
#     - ref: client-id-enforcement

assetId: client-id-enforcement
policyVersion: "1.3.3"
groupId: "68ef9520-24e9-4cf2-b2f5-620025690913"
defaults:
  credentialsOriginHasHttpBasicAuthenticationHeader: customExpression
  clientIdExpression: "#[attributes.headers['client_id']]"
  clientSecretExpression: "#[attributes.headers['client_secret']]"
