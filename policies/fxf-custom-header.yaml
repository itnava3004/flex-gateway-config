# Policy template: FXF Custom Header Injection (custom Exchange policy)
# Injects FXF-specific internal headers before routing to the backend.
# This is a custom policy published to the FXF org's Exchange under the
# group ID below (not the MuleSoft-owned group).
#
# Usage in apis/{app}/config.yaml:
#   policies:
#     - assetId: fxf-custom-header
#       policyVersion: "1.0.0"
#       groupId: "<<FXF_ORG_GROUP_ID>>"
#       config:
#         headers:
#           X-FXF-Source: flex-gateway
#           X-FXF-Environment: "${env}"

assetId: fxf-custom-header
policyVersion: "1.0.0"
groupId: "<<FXF_ORG_GROUP_ID>>"
defaults:
  headers:
    X-FXF-Source: flex-gateway
