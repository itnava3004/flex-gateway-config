# Common policies applied to every API in every wave.
#
# Rules:
#   - Each policy here is applied to ALL APIs automatically.
#   - If an API declares the same assetId in its own apis/<name>/config.yaml,
#     that API-specific definition wins (it overrides the common one).
#   - To add a policy only to specific APIs, put it in apis/<name>/config.yaml instead.
#
policies:
  - assetId: rate-limiting
    policyVersion: "1.5.1"
    config:
      rateLimits:
        - maximumRequests: 100
          timePeriodInMilliseconds: 1000
