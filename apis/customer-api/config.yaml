# Environment-independent contract for this API.
# Backend URIs and proxy ports are per-environment and live in
# envs/<app>/<env>/runtime.yaml.
app: customer-api
assetId: customer-api
# Optional display names. apiLabel is the base of the API instance label in
# API Manager (the environment suffix is appended); upstreamLabel names the
# upstream. Both default to the folder name. NOTE: changing apiLabel on an
# API already deployed makes the pipeline create a NEW instance rather than
# reuse the existing one, because instances are matched by label.
# apiLabel: Customer API
# upstreamLabel: Customer Backend
exchangeVersion: 1.0.0   # Exchange asset version
configVersion:   1.0.0   # current version of this config contract

# Route rules. routeLabel is the name shown against the route in API Manager
# and defaults to the endpoint name. methods and headers are optional and
# constrain which requests match; omit them to match on path alone.
endpoints:
  - name: customer-address
    routeLabel: Customer Address
    publicPath: /customer/v1/address
    methods: [GET]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement
  - name: customer-consent
    routeLabel: Customer Consent
    publicPath: /customer/v1/consent
    methods: [GET, POST]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement
  - name: customer-profile
    routeLabel: Customer Profile
    publicPath: /customer/v1/profile
    methods: [GET]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement

# Policy references, keyed by policy name. assetId, policyVersion, groupId
# and the default config live in policies/<policy>.yaml. Give a policy a value
# to layer API-specific settings over those defaults; leave it empty to take
# the defaults unchanged. Order here is the order policies are applied.
policies:
  client-id-enforcement:
  rate-limiting:
    rateLimits:
      - maximumRequests: 25
        timePeriodInMilliseconds: 1000
  ip-allowlist:
    ips:
      - 10.40.0.0/16
