app: customer-api
assetId: customer-api
version: 1.0.0
endpoints:
  - name: customer-address
    uri: https://l7-gw.fxf.internal/customer/address
    publicPath: /customer/v1/address
    authPattern: client-id-enforcement
  - name: customer-consent
    uri: https://l7-gw.fxf.internal/customer/consent
    publicPath: /customer/v1/consent
    authPattern: client-id-enforcement
  - name: customer-profile
    uri: https://l7-gw.fxf.internal/customer/profile
    publicPath: /customer/v1/profile
    authPattern: client-id-enforcement
policies:
  - assetId: client-id-enforcement
    policyVersion: "1.3.3"
    config:
      credentialsOriginHasHttpBasicAuthenticationHeader: customExpression
      clientIdExpression: "#[attributes.headers['client_id']]"
      clientSecretExpression: "#[attributes.headers['client_secret']]"
  - assetId: rate-limiting
    policyVersion: "1.5.1"
    config:
      rateLimits:
        - maximumRequests: 25
          timePeriodInMilliseconds: 1000
  - assetId: ip-allowlist
    policyVersion: "1.1.2"
    config:
      ipExpression: "#[attributes.headers['x-forwarded-for']]"
      ips:
        - 10.40.0.0/16
