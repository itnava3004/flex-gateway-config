# Environment-independent contract for this API.
# Backend URIs and proxy ports are per-environment and live in
# envs/<app>/<env>/runtime.yaml.
app: orders-api
assetId: orders-api
version: 1.0.0         # Exchange asset version
apiVersion: 1.0.0      # current version of this config contract

# Route rules. methods and headers are optional and constrain which requests
# match the route in API Manager; omit them to match on path alone.
endpoints:
  - name: orders-cancel
    publicPath: /orders/v1/cancel
    methods: [POST]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement
  - name: orders-create
    publicPath: /orders/v1/create
    methods: [POST]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement
  - name: orders-list
    publicPath: /orders/v1/list
    methods: [GET]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement
  - name: orders-track
    publicPath: /orders/v1/track
    methods: [GET]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement

# Policy references only. assetId, policyVersion, groupId and the default
# config live in policies/<policy>.yaml. Add `config:` to layer API-specific
# values over those defaults; omit it to use the defaults unchanged.
policies:
  - ref: client-id-enforcement
  - ref: rate-limiting
    config:
      rateLimits:
        - maximumRequests: 100
          timePeriodInMilliseconds: 1000
  - ref: ip-allowlist
    config:
      ips:
        - 10.30.0.0/16
