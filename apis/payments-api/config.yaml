# Environment-independent contract for this API.
# Backend URIs and proxy ports are per-environment and live in
# envs/<app>/<env>/runtime.yaml.
app: payments-api
assetId: payments-api
version: 2.0.0         # Exchange asset version
apiVersion: 1.0.0      # current version of this config contract

# Route rules. methods and headers are optional and constrain which requests
# match the route in API Manager; omit them to match on path alone.
endpoints:
  - name: payments-charge
    publicPath: /payments/v1/charge
    methods: [POST]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement
  - name: payments-refund
    publicPath: /payments/v1/refund
    methods: [POST]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement
  - name: payments-status
    publicPath: /payments/v1/status
    methods: [GET]
    headers:
      X-FXF-Channel: internal
    authPattern: client-id-enforcement

# Policy references only. assetId, policyVersion, groupId and the default
# config live in policies/<policy>.yaml — a bare name uses those defaults,
# and `config:` layers API-specific values over them.
policies:
  - client-id-enforcement
  - ref: rate-limiting
    config:
      rateLimits:
        - maximumRequests: 50
          timePeriodInMilliseconds: 1000
  - ref: ip-allowlist
    config:
      ips:
        - 10.20.0.0/16
